<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lost at Sea · Harbor Forge</title>
  <script>
    (function () {
      var t;
      try { t = localStorage.getItem("hf-theme"); } catch (e) {}
      if (t !== "light" && t !== "dark") t = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
      document.documentElement.dataset.theme = t;
    })();
  </script>
  <link rel="icon"href="assets/favicon.svg" type="image/svg+xml" />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Inter:wght@400;500&family=JetBrains+Mono&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="hero" style="text-align:center">
    <div class="hero-inner">
      <p class="eyebrow mono">404 · Off the charts</p>
      <h1 style="margin:0 auto">Lost at sea.<br /><span class="ember">This page hasn't been forged yet.</span></h1>
      <div class="hero-actions" style="justify-content:center">
        <a class="btn btn-primary" href="./">Return to harbor</a>
      </div>
    </div>
  </main>
</body>
</html>
